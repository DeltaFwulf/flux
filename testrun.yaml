# runtime settings for multi_2d

tf: 100.0
dt_storage: 1.0
theta: 0.5      # explicit - implicit factor (0 = exp, 1 = imp)
# curvature factor (0 = planar, 1 = cylindrical, 2 = spherical)
max_courant: 0.5

meshes:

  mesh_a:
    dx: 0.005
    dy: 0.005
    u0: 50.0  # initial temperature, K
    material: 'IN_26_firebrick'
    curvature: 1
    
    lines: 
    - [[0.035, 0.0], [0.111, 0.0]]
    - [[0.111, 0.0], [0.111, 0.21]]
    - [[0.111, 0.21], [0.035, 0.21]]
    - [[0.035, 0.21], [0.035, 0.192]]
    - [[0.035, 0.192], [0.045, 0.192]]
    - [[0.045, 0.192], [0.045, 0.102]]
    - [[0.045, 0.102], [0.035, 0.102]]
    - [[0.035, 0.102], [0.035, 0.0]]

    bc:
    - {mode: 'conduction', link: ['mesh_b/2']}
    - {mode: 'dirichlet', link: [], value: 50.0}
    - {mode: 'dirichlet', link: [], value: 50.0}
    - {mode: 'dirichlet', link: [], value: 50.0}
    - {mode: 'dirichlet', link: [], value: 50.0}
    - {mode: 'dirichlet', link: [], value: 50.0}
    - {mode: 'dirichlet', link: [], value: 50.0}
    - {mode: 'dirichlet', link: [], value: 50.0}

  mesh_b:
    dx: 0.01
    dy: 0.01
    u0: 10.0
    material: 'stainless_steel'
    curvature: 1

    lines:
    - [[0.035, -0.05], [0.111, -0.05]]
    - [[0.111, -0.05], [0.111, 0.0]]
    - [[0.111, 0.0], [0.035, 0.0]]
    - [[0.035, 0.0], [0.035, -0.05]]

    bc:
    - {mode: 'neumann', value: 0.0}
    - {mode: 'neumann', value: 0.0}
    - {mode: 'conduction', link: ['mesh_a/0']}
    - {mode: 'neumann', value: 0.0}


environment: # objects referenced in simulation
  
  ambient:
    u: 288.0
    type: 'fluid' # TODO: give a final designation for different types of conditions