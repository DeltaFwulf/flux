# Simulation file for OctoForge Chamber

tf: 7200.0
dt_storage: 36.0
theta: 0.5      # explicit - implicit factor (0 = exp, 1 = imp)
max_courant: 0.5
force_finer: True

meshes:

  firebrick:
    label: 'firebrick'
    dx: 0.005
    dy: 0.005
    u0: 288.0
    material: 'IN_26_firebrick'
    curvature: 1

    lines:
    - [[0.035, 0.0], [0.111, 0.0]]
    - [[0.111, 0.0], [0.111, 0.15]]
    - [[0.111, 0.15], [0.035, 0.15]]
    
    # notch 0
    - [[0.035, 0.15], [0.035, 0.13]]
    - [[0.035, 0.13], [0.045, 0.13]]
    - [[0.045, 0.13], [0.045, 0.12]]
    - [[0.045, 0.12], [0.035, 0.12]]

    - [[0.035, 0.12], [0.035, 0.10]]

    # notch 1
    - [[0.035, 0.10], [0.045, 0.10]]
    - [[0.045, 0.10], [0.045, 0.09]]
    - [[0.045, 0.09], [0.035, 0.09]]

    - [[0.035, 0.09], [0.035, 0.07]]
    
    # notch 2
    - [[0.035, 0.07], [0.045, 0.07]]
    - [[0.045, 0.07], [0.045, 0.06]]
    - [[0.045, 0.06], [0.035, 0.06]]
    
    - [[0.035, 0.06], [0.035, 0.04]]

    # notch 3
    - [[0.035, 0.04], [0.045, 0.04]]
    - [[0.045, 0.04], [0.045, 0.03]]
    - [[0.045, 0.03], [0.035, 0.03]]

    - [[0.035, 0.03], [0.035, 0.0]]

    # We assume that the notch faces are irradiated by the heating elements,
    # while the inner faces are irradiated by the crucible. (this is not accurate, but 
    # we need a better radiation model to out do this for now).

    boundary_conditions:
    - {edge: 0, mode: 'neumann', value: 0.0}
    - {edge: 1, mode: 'conduction', link: 'rockwool_blanket/3'}
    - {edge: 2, mode: 'neumann', value: 0.0}
    - {edge: 3, mode: 'neumann', value: 0.0}
    
    - {edge: 4, mode: 'radiation', link: 'heating_element'}
    - {edge: 5, mode: 'radiation', link: 'heating_element'}
    - {edge: 6, mode: 'radiation', link: 'heating_element'}
    
    - {edge: 7, mode: 'neumann', value: 0.0}

    - {edge: 8, mode: 'radiation', link: 'heating_element'}
    - {edge: 9, mode: 'radiation', link: 'heating_element'}
    - {edge: 10, mode: 'radiation', link: 'heating_element'}

    - {edge: 11, mode: 'neumann', value: 0.0}

    - {edge: 12, mode: 'radiation', link: 'heating_element'}
    - {edge: 13, mode: 'radiation', link: 'heating_element'}
    - {edge: 14, mode: 'radiation', link: 'heating_element'}

    - {edge: 15, mode: 'neumann', value: 0.0}

    - {edge: 16, mode: 'radiation', link: 'heating_element'}
    - {edge: 17, mode: 'radiation', link: 'heating_element'}
    - {edge: 18, mode: 'radiation', link: 'heating_element'}

    - {edge: 19, mode: 'neumann', value: 0.0}

  
  rockwool_blanket:
    label: 'rockwool blanket'
    dx: 0.01
    dy: 0.005
    u0: 288.0
    material: 'IN_26_firebrick'
    curvature: 1

    lines:
    - [[0.111, 0.0], [0.211, 0.0]]
    - [[0.211, 0.0], [0.211, 0.15]]
    - [[0.211, 0.15], [0.111, 0.15]]
    - [[0.111, 0.15], [0.111, 0.0]]

    boundary_conditions:
    - {edge: 0, mode: 'neumann', value: 0.0}
    - {edge: 1, mode: 'conduction', link: 'outer_panel/3'}
    - {edge: 2, mode: 'neumann', value: 0.0}
    - {edge: 3, mode: 'conduction', link: 'firebrick/1'}

  
  outer_panel:
    label: 'steel outer panel'
    dx: 0.001
    dy: 0.02
    u0: 288.0
    material: 'stainless_steel'
    curvature: 1

    lines:
    - [[0.211, 0.0], [0.213, 0.0]]
    - [[0.213, 0.0], [0.213, 0.15]]
    - [[0.213, 0.15], [0.211, 0.15]]
    - [[0.211, 0.15], [0.211, 0.0]]

    boundary_conditions:
    - {edge: 0, mode: 'convection', link: 'ambient_air'}
    - {edge: 1, mode: 'convection', link: 'ambient_air'}
    - {edge: 2, mode: 'convection', link: 'ambient_air'}
    - {edge: 3, mode: 'conduction', link: 'rockwool_blanket/1'}


lumped_capacitors:

  crucible:
    label: 'graphite crucible'
    u0: 288.0
    material: 'graphite'
    curvature: 1

    lines:
    - [[0.0, 0.0], [0.025, 0.0]]
    - [[0.025, 0.0], [0.025, 0.15]]
    - [[0.025, 0.15], [0.0, 0.15]]
    - [[0.0, 0.15], [0.0, 0.0]]

    boundary_conditions:
    - {edge: 0, mode: 'neumann', value: 0.0}
    - {edge: 1, mode: 'radiation', link: 'firebrick/3'}
    - {edge: 2, mode: 'neumann', value: 0.0}
    - {edge: 3, mode: 'neumann', value: 0.0}


environment:
  
  ambient_air:
    name: 'Air'
    temperature: 288.0
    pressure: 101325
    phase: 'gas'
    velocity: 0.0

  heating_element:
    name: 'heating element'
    temperature: 1400.0
    emissivity: 0.8

  crucible:
    name: 'crucible'
    temperature: 288.0
    material: 'graphite'
    mass: 1.0
    area: 0.027 # approximately, including base and fake top